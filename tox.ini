[tox]
envlist = py{37,38,39,310,311}, lint, security, docs
skip_missing_interpreters = true

[testenv]
deps =
    -r requirements.txt
    -r requirements-dev.txt
passenv =
    CI
    GITHUB_*
setenv =
    PYTHONPATH = {toxinidir}
commands =
    pytest tests/ --cov=core --cov=ui --cov-report=html --cov-report=xml {posargs}

[testenv:lint]
deps =
    flake8>=6.0.0
    black>=23.0.0
    isort>=5.12.0
    mypy>=1.0.0
commands =
    flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    black --check --diff .
    isort --check-only --diff .
    mypy . --ignore-missing-imports

[testenv:security]
deps =
    bandit>=1.7.0
    safety>=2.3.0
commands =
    bandit -r . -f json -o bandit-report.json
    safety check --full-report

[testenv:format]
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black .
    isort .

[testenv:docs]
deps =
    mkdocs>=1.4.0
    mkdocs-material>=9.0.0
changedir = docs
commands =
    mkdocs build

[testenv:build]
deps =
    setuptools>=65.0.0
    wheel>=0.37.0
    twine>=4.0.0
commands =
    python setup.py sdist bdist_wheel
    twine check dist/*

[testenv:benchmark]
deps =
    -r requirements.txt
setenv =
    PYTHONPATH = {toxinidir}
commands =
    python benchmark/comprehensive_benchmark_suite.py

[testenv:pre-commit]
deps =
    pre-commit>=3.0.0
commands =
    pre-commit run --all-files

[flake8]
max-line-length = 127
extend-ignore = E203,W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    .tox,
    .eggs,
    *.egg
