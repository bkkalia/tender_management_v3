[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-management-utility"
version = "3.2.0"
description = "Professional tender data management with advanced search, filtering, and visualization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
keywords = ["tender", "management", "procurement", "data", "analysis", "search", "filter", "visualization"]
dependencies = [
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
    "matplotlib>=3.5.0",
    "Pillow>=8.0.0",
    "tkcalendar>=1.6.0",
    "psutil>=5.8.0",
    "filelock>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-material-extensions>=1.1.0",
    "pyinstaller>=5.0.0",
    "setuptools>=65.0.0",
    "wheel>=0.37.0",
    "twine>=4.0.0",
    "pre-commit>=3.0.0",
    "tox>=4.0.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.0.0",
    "types-requests>=2.28.0",
    "types-Pillow>=9.0.0",
    "python-lsp-server>=1.7.0",
    "pre-commit-hooks>=4.4.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
lint = [
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
security = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
]
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
tender-management = "main:main"
tmu = "main:main"

[project.gui-scripts]
tender-management-gui = "main:main"

[tool.black]
line-length = 127
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 127
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".tox",
    ".eggs",
    "*.egg",
]

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "tkinter.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "benchmark", "docs"]
skips = ["B101", "B601"]  # Skip assert checks and shell usage

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=core --cov=ui --cov-report=html --cov-report=xml"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["core", "ui", "utils"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "*/benchmark/*",
    "*/scripts/*",
    "*/tools/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
